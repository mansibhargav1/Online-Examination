services:
  db:
    image: postgres:16-alpine
    container_name: exam_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: exampass
      POSTGRES_DB: examdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examuser -d examdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: exam_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://examuser:exampass@db:5432/examdb
      JWT_SECRET: change-this-to-a-long-random-string-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "240"
      ADMIN_EMAIL: admin@exam.com
      ADMIN_PASSWORD: Admin@12345
      QUESTION_TIME_SECONDS: "120"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
      SEED_DEMO_EXAM: "true"
      # Email — values come from the .env file at the project root.
      # Leave MAIL_ENABLED unset/false and the app runs fine without a mail server.
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      MAIL_FROM: "${MAIL_FROM:-}"
      PORTAL_URL: "${PORTAL_URL:-http://localhost:8080}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: exam_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
